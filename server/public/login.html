<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orium — Log in</title>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
      integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 420px;
        margin: 60px auto;
        padding: 20px;
        color: #1a1a1a;
      }
      .container {
        border: 1px solid #ddd;
        padding: 24px;
        border-radius: 10px;
      }
      h1 {
        font-size: 1.3rem;
        margin-top: 0;
      }
      label {
        display: block;
        font-size: 0.9rem;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 10px;
        background: #1a1a1a;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        color: #dc2626;
        font-size: 0.9rem;
        margin-top: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Log in to Orium</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="submit" id="submitButton">Log in</button>
      </form>
      <div class="error" id="error"></div>
      <p style="margin-top: 16px; font-size: 0.8rem; color: #666; text-align: center">
        <a href="/privacy" target="_blank" rel="noreferrer">Privacy policy</a>
      </p>
    </div>

    <script>
      const SUPABASE_URL = "https://imxmcavkzpbbqbhcefkj.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8aMCvghGGRHIwMogWkHAzA_yl1yFI9N";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
      );

      // Only ever redirect to a same-site relative path, never an external
      // URL — the `redirect` query param is otherwise attacker-controllable
      // and could be used to bounce a phished login to another origin.
      function safeRedirectTarget() {
        const params = new URLSearchParams(window.location.search);
        const target = params.get("redirect");
        if (target && target.startsWith("/") && !target.startsWith("//")) {
          return target;
        }
        return "/oauth/consent";
      }

      const form = document.getElementById("loginForm");
      const errorEl = document.getElementById("error");
      const submitButton = document.getElementById("submitButton");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.style.display = "none";
        submitButton.disabled = true;

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          errorEl.textContent = error.message;
          errorEl.style.display = "block";
          submitButton.disabled = false;
          return;
        }

        window.location.href = safeRedirectTarget();
      });
    </script>
  </body>
</html>
