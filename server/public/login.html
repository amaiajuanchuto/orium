<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orium — Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
      integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family:
          "Nunito",
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 420px;
        margin: 60px auto;
        padding: 20px;
        color: #3d472d;
        background: #fef8e5;
      }
      .logo {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
      }
      .container {
        background: #fffdf3;
        border: 1px solid rgba(61, 71, 45, 0.1);
        box-shadow: 0 8px 24px rgba(61, 71, 45, 0.06);
        padding: 28px;
        border-radius: 18px;
      }
      h1 {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        font-size: 1.3rem;
        margin-top: 0;
        text-align: center;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: #8b7f70;
        margin: 14px 0 4px;
      }
      input {
        width: 100%;
        padding: 9px 12px;
        box-sizing: border-box;
        border: 1px solid rgba(61, 71, 45, 0.16);
        background: #fffef7;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        color: #3d472d;
      }
      input:focus {
        outline: none;
        border-color: #7e9d4d;
      }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 11px;
        background: #7e9d4d;
        color: #fef8e5;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover:not(:disabled) {
        background: #5f7d38;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        color: #9c3b23;
        font-size: 0.9rem;
        margin-top: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="logo" src="/logo-mark.png" alt="" />
      <h1>Log in to Orium</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="submit" id="submitButton">Log in</button>
      </form>
      <div class="error" id="error"></div>
      <p style="margin-top: 18px; font-size: 0.8rem; color: #8b7f70; text-align: center">
        <a href="/privacy" target="_blank" rel="noreferrer" style="color: inherit"
          >Privacy policy</a
        >
      </p>
    </div>

    <script>
      const SUPABASE_URL = "https://imxmcavkzpbbqbhcefkj.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8aMCvghGGRHIwMogWkHAzA_yl1yFI9N";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
      );

      // Only ever redirect to a same-site relative path, never an external
      // URL — the `redirect` query param is otherwise attacker-controllable
      // and could be used to bounce a phished login to another origin.
      function safeRedirectTarget() {
        const params = new URLSearchParams(window.location.search);
        const target = params.get("redirect");
        if (target && target.startsWith("/") && !target.startsWith("//")) {
          return target;
        }
        return "/oauth/consent";
      }

      const form = document.getElementById("loginForm");
      const errorEl = document.getElementById("error");
      const submitButton = document.getElementById("submitButton");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.style.display = "none";
        submitButton.disabled = true;

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          errorEl.textContent = error.message;
          errorEl.style.display = "block";
          submitButton.disabled = false;
          return;
        }

        window.location.href = safeRedirectTarget();
      });
    </script>
  </body>
</html>
