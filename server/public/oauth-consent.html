<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orium — Authorize access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
      integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family:
          "Nunito",
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 420px;
        margin: 60px auto;
        padding: 20px;
        color: #3d472d;
        background: #fef8e5;
      }
      .logo {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
      }
      .container {
        background: #fffdf3;
        border: 1px solid rgba(61, 71, 45, 0.1);
        box-shadow: 0 8px 24px rgba(61, 71, 45, 0.06);
        padding: 28px;
        border-radius: 18px;
      }
      h1 {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        font-size: 1.3rem;
        margin-top: 0;
        text-align: center;
      }
      .app-name {
        font-weight: 700;
      }
      p {
        text-align: center;
      }
      ul {
        padding-left: 20px;
        color: #4a4038;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        flex: 1;
        padding: 11px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      .approve {
        background: #7e9d4d;
        color: #fef8e5;
      }
      .approve:hover {
        background: #5f7d38;
      }
      .deny {
        background: #eef0d9;
        color: #4a4038;
      }
      .deny:hover {
        background: #e7e3ca;
      }
      .error {
        color: #9c3b23;
        font-size: 0.9rem;
        margin-top: 12px;
      }
      .loading {
        color: #8b7f70;
        text-align: center;
      }
      #content {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="logo" src="/logo-mark.png" alt="" />
      <div id="loading" class="loading">Loading...</div>
      <div id="content">
        <h1>Authorize access to your journal</h1>
        <p>
          <span class="app-name" id="clientName"></span> wants to access your Orium
          journal.
        </p>
        <p>Requested permissions:</p>
        <ul id="scopesList"></ul>
        <div class="actions">
          <button class="deny" id="denyButton">Deny</button>
          <button class="approve" id="approveButton">Approve</button>
        </div>
        <p style="margin-top: 18px; font-size: 0.8rem; color: #8b7f70">
          <a href="/privacy" target="_blank" rel="noreferrer" style="color: inherit"
            >Privacy policy</a
          >
        </p>
      </div>
      <div class="error" id="error" style="display: none"></div>
    </div>

    <script>
      const SUPABASE_URL = "https://imxmcavkzpbbqbhcefkj.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8aMCvghGGRHIwMogWkHAzA_yl1yFI9N";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
      );

      const loadingEl = document.getElementById("loading");
      const contentEl = document.getElementById("content");
      const errorEl = document.getElementById("error");

      function showError(message) {
        loadingEl.style.display = "none";
        contentEl.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent = message;
      }

      let authorizationId = null;

      async function init() {
        const params = new URLSearchParams(window.location.search);
        authorizationId = params.get("authorization_id");

        if (!authorizationId) {
          showError("Missing authorization_id parameter.");
          return;
        }

        const {
          data: { user },
        } = await supabaseClient.auth.getUser();

        if (!user) {
          const currentUrl = window.location.pathname + window.location.search;
          window.location.href = `/login?redirect=${encodeURIComponent(currentUrl)}`;
          return;
        }

        const { data, error } =
          await supabaseClient.auth.oauth.getAuthorizationDetails(authorizationId);

        if (error) {
          showError(`Could not load authorization details: ${error.message}`);
          return;
        }

        // Already consented previously — Supabase returns a redirect instead
        // of authorization details in that case.
        if ("redirect_url" in data) {
          window.location.href = data.redirect_url;
          return;
        }

        document.getElementById("clientName").textContent =
          data.client?.name || "An application";

        const scopesList = document.getElementById("scopesList");
        const scopes = data.scope ? data.scope.split(" ").filter(Boolean) : [];
        if (scopes.length === 0) {
          const li = document.createElement("li");
          li.textContent = "Full access to your journal entries";
          scopesList.appendChild(li);
        } else {
          scopes.forEach((scope) => {
            const li = document.createElement("li");
            li.textContent = scope;
            scopesList.appendChild(li);
          });
        }

        loadingEl.style.display = "none";
        contentEl.style.display = "block";
      }

      document.getElementById("approveButton").addEventListener("click", async () => {
        const { data, error } = await supabaseClient.auth.oauth.approveAuthorization(
          authorizationId,
          { skipBrowserRedirect: true },
        );
        if (error) {
          showError(`Approval failed: ${error.message}`);
          return;
        }
        window.location.href = data.redirect_url;
      });

      document.getElementById("denyButton").addEventListener("click", async () => {
        const { data, error } = await supabaseClient.auth.oauth.denyAuthorization(
          authorizationId,
          { skipBrowserRedirect: true },
        );
        if (error) {
          showError(`Denial failed: ${error.message}`);
          return;
        }
        window.location.href = data.redirect_url;
      });

      init();
    </script>
  </body>
</html>
