name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (typecheck both workspaces)
        run: npm run build

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Provides the local Postgres instance (with the auth schema and RLS
      # policies from server/supabase/migrations) that the test suite runs
      # against — see server/src/db/testUser.ts for why auth.users must exist.
      - name: Start local Supabase
        working-directory: server
        run: supabase start

      - name: Test
        run: npm test
