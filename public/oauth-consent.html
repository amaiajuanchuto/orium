<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orium — Authorize access</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 420px;
        margin: 60px auto;
        padding: 20px;
        color: #1a1a1a;
      }
      .container {
        border: 1px solid #ddd;
        padding: 24px;
        border-radius: 10px;
      }
      h1 {
        font-size: 1.3rem;
        margin-top: 0;
      }
      .app-name {
        font-weight: 600;
      }
      ul {
        padding-left: 20px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      .approve {
        background: #16a34a;
        color: white;
      }
      .deny {
        background: #eee;
        color: #1a1a1a;
      }
      .error {
        color: #dc2626;
        font-size: 0.9rem;
        margin-top: 12px;
      }
      .loading {
        color: #666;
      }
      #content {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loading" class="loading">Loading...</div>
      <div id="content">
        <h1>Authorize access to your journal</h1>
        <p><span class="app-name" id="clientName"></span> wants to access your Orium journal.</p>
        <p>Requested permissions:</p>
        <ul id="scopesList"></ul>
        <div class="actions">
          <button class="deny" id="denyButton">Deny</button>
          <button class="approve" id="approveButton">Approve</button>
        </div>
      </div>
      <div class="error" id="error" style="display: none"></div>
    </div>

    <script>
      const SUPABASE_URL = "https://imxmcavkzpbbqbhcefkj.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8aMCvghGGRHIwMogWkHAzA_yl1yFI9N";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const loadingEl = document.getElementById("loading");
      const contentEl = document.getElementById("content");
      const errorEl = document.getElementById("error");

      function showError(message) {
        loadingEl.style.display = "none";
        contentEl.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent = message;
      }

      let authorizationId = null;

      async function init() {
        const params = new URLSearchParams(window.location.search);
        authorizationId = params.get("authorization_id");

        if (!authorizationId) {
          showError("Missing authorization_id parameter.");
          return;
        }

        const {
          data: { user },
        } = await supabaseClient.auth.getUser();

        if (!user) {
          const currentUrl = window.location.pathname + window.location.search;
          window.location.href = `/login?redirect=${encodeURIComponent(currentUrl)}`;
          return;
        }

        let details;
        try {
          details = await supabaseClient.auth.oauth.getAuthorizationDetails(authorizationId);
        } catch (error) {
          showError(`Could not load authorization details: ${error.message}`);
          return;
        }

        document.getElementById("clientName").textContent =
          details.client_name || "An application";

        const scopesList = document.getElementById("scopesList");
        const scopes = details.scopes || [];
        if (scopes.length === 0) {
          const li = document.createElement("li");
          li.textContent = "Full access to your journal entries";
          scopesList.appendChild(li);
        } else {
          scopes.forEach((scope) => {
            const li = document.createElement("li");
            li.textContent = scope;
            scopesList.appendChild(li);
          });
        }

        loadingEl.style.display = "none";
        contentEl.style.display = "block";
      }

      document.getElementById("approveButton").addEventListener("click", async () => {
        try {
          const result = await supabaseClient.auth.oauth.approveAuthorization(authorizationId);
          window.location.href = result.redirect_url;
        } catch (error) {
          showError(`Approval failed: ${error.message}`);
        }
      });

      document.getElementById("denyButton").addEventListener("click", async () => {
        try {
          const result = await supabaseClient.auth.oauth.denyAuthorization(authorizationId);
          window.location.href = result.redirect_url;
        } catch (error) {
          showError(`Denial failed: ${error.message}`);
        }
      });

      init();
    </script>
  </body>
</html>
