services:
  - type: web
    name: orium-mcp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://imxmcavkzpbbqbhcefkj.supabase.co
      - key: PUBLIC_URL
        value: https://orium-mcp.onrender.com
      - key: NODE_VERSION
        value: 20
